<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Highlighter Neon Gradient -->
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .letter {
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .muted {
      fill: #64748b;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.85;
    }
    .highlighted {
      fill: #ffffff;
      font-size: 14px;
      font-weight: 900;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.8));
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 2 2;
      opacity: 0.5;
    }
  </style>

  <!-- Card Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Grid Dividers -->
  <line x1="24" y1="8" x2="24" y2="56" class="grid-line" />
  <line x1="40" y1="8" x2="40" y2="56" class="grid-line" />
  <line x1="8" y1="24" x2="56" y2="24" class="grid-line" />
  <line x1="8" y1="40" x2="56" y2="40" class="grid-line" />

  <!-- Diagonal Highlighter Stroke (W -> S -> P) -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="url(#hlGrad)" stroke-width="16" stroke-linecap="round" opacity="0.88" filter="url(#glow)" />
  <line x1="16" y1="16" x2="48" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- 3x3 Letters -->
  <!-- Row 1 -->
  <text x="16" y="16" class="letter highlighted">W</text>
  <text x="32" y="16" class="letter muted">O</text>
  <text x="48" y="16" class="letter muted">R</text>

  <!-- Row 2 -->
  <text x="16" y="32" class="letter muted">D</text>
  <text x="32" y="32" class="letter highlighted">S</text>
  <text x="48" y="32" class="letter muted">E</text>

  <!-- Row 3 -->
  <text x="16" y="48" class="letter muted">2</text>
  <text x="32" y="48" class="letter muted">P</text>
  <text x="48" y="48" class="letter highlighted">P</text>
</svg>
